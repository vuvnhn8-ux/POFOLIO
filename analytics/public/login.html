<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231a1a2e'/%3E%3Cpath d='M6 17V11m4 6V7m4 10v-4m4 4V9' stroke='%236366f1' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Sign in - Analytics</title>
    <link rel="stylesheet" href="/analytics/assets/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="login-head">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#1a1a2e"/>
          <path d="M6 17V11m4 6V7m4 10v-4m4 4V9" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>Portfolio Analytics</h1>
        <p>Private dashboard</p>
      </div>
      <form class="login-form" method="post" action="/analytics/login">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" autofocus />
        <button type="submit">Sign in</button>
        <p class="login-error" data-login-error hidden>Incorrect password.</p>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).has('error')) {
        document.querySelector('[data-login-error]').hidden = false;
      }
    </script>
  </body>
</html>
