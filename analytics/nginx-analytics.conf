# Reverse proxy for the polofio analytics server.
# Installed by deploy-remote.ps1 into /etc/nginx/sites-available/polofio-analytics.conf.
# certbot --nginx rewrites this file to add HTTPS + redirect after issuance.

server {
    listen 80;
    listen [::]:80;
    server_name analytics.hoangvuvan.xyz;

    client_max_body_size 2k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
