<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"></stop>
      <stop offset="100%" stop-color="#1e293b"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"></stop>
      <stop offset="100%" stop-color="#00FFA3"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"></rect>

  <!-- Circuit -->
  <g stroke="#334155" stroke-width="6" fill="none">
    <path d="M170 260 H330 V200 H470"></path>
    <path d="M854 260 H694 V180 H560"></path>
    <path d="M170 764 H330 V824 H470"></path>
    <path d="M854 764 H694 V844 H560"></path>
    <path d="M250 512 H390"></path>
    <path d="M634 512 H774"></path>
  </g>

  <g fill="#475569">
    <circle cx="170" cy="260" r="10"></circle>
    <circle cx="470" cy="200" r="10"></circle>
    <circle cx="854" cy="260" r="10"></circle>
    <circle cx="560" cy="180" r="10"></circle>
    <circle cx="170" cy="764" r="10"></circle>
    <circle cx="470" cy="824" r="10"></circle>
    <circle cx="854" cy="764" r="10"></circle>
    <circle cx="560" cy="844" r="10"></circle>
  </g>

  <!-- Gear -->
  <g transform="translate(512 470)">
    <g fill="url(#accent)" filter="url(#glow)">
      <circle r="175"></circle>
      <rect x="-18" y="-250" width="36" height="70" rx="10"></rect>
      <rect x="-18" y="180" width="36" height="70" rx="10"></rect>
      <rect x="-250" y="-18" width="70" height="36" rx="10"></rect>
      <rect x="180" y="-18" width="70" height="36" rx="10"></rect>

      <rect x="-18" y="-250" width="36" height="70" rx="10" transform="rotate(45)"></rect>
      <rect x="-18" y="-250" width="36" height="70" rx="10" transform="rotate(90)"></rect>
      <rect x="-18" y="-250" width="36" height="70" rx="10" transform="rotate(135)"></rect>
      <rect x="-18" y="-250" width="36" height="70" rx="10" transform="rotate(225)"></rect>
      <rect x="-18" y="-250" width="36" height="70" rx="10" transform="rotate(270)"></rect>
      <rect x="-18" y="-250" width="36" height="70" rx="10" transform="rotate(315)"></rect>
    </g>

    <circle r="125" fill="#0f172a"></circle>

    <!-- PLC Chip -->
    <rect x="-72" y="-72" width="144" height="144" rx="18" fill="#1e293b" stroke="url(#accent)" stroke-width="8"></rect>

    <g stroke="url(#accent)" stroke-width="6">
      <line x1="-92" y1="-48" x2="-72" y2="-48"></line>
      <line x1="-92" y1="-16" x2="-72" y2="-16"></line>
      <line x1="-92" y1="16" x2="-72" y2="16"></line>
      <line x1="-92" y1="48" x2="-72" y2="48"></line>

      <line x1="72" y1="-48" x2="92" y2="-48"></line>
      <line x1="72" y1="-16" x2="92" y2="-16"></line>
      <line x1="72" y1="16" x2="92" y2="16"></line>
      <line x1="72" y1="48" x2="92" y2="48"></line>
    </g>

    <path d="M-42 0 L-18 0 L-4 -32 L18 32 L34 0 L48 0" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <!-- Brand -->
  <text x="512" y="915" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="4" fill="#ffffff" filter="url(#glow)">
    HOANGAUTOMATION
  </text>
</svg>