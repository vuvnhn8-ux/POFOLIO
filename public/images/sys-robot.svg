<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-labelledby="t">
  <title id="t">Robot cell with PLC orchestration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#1e293b" stroke-width="2"/>
  <text x="28" y="40" fill="#34d399" font-family="ui-monospace,monospace" font-size="13">YASKAWA ROBOT CELL</text>
  <text x="28" y="58" fill="#64748b" font-family="ui-monospace,monospace" font-size="10">MES Recipe → PLC → Robot Controller → Gripper</text>
  <!-- floor / cell boundary -->
  <rect x="48" y="90" width="360" height="230" rx="12" fill="#020617" stroke="#334155" stroke-dasharray="6 4"/>
  <text x="60" y="112" fill="#64748b" font-size="10" font-family="ui-monospace,monospace">SAFETY ZONE</text>
  <!-- base -->
  <ellipse cx="200" cy="280" rx="48" ry="12" fill="#1e293b"/>
  <rect x="176" y="250" width="48" height="30" rx="4" fill="#1e293b" stroke="#64748b"/>
  <!-- arm links -->
  <line x1="200" y1="250" x2="200" y2="190" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="200" cy="190" r="10" fill="#3b82f6"/>
  <line x1="200" y1="190" x2="280" y2="150" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
  <circle cx="280" cy="150" r="9" fill="#10b981"/>
  <line x1="280" y1="150" x2="340" y2="175" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  <!-- gripper -->
  <path d="M340 175 L355 195 M340 175 L325 195" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <rect x="318" y="195" width="44" height="18" rx="3" fill="#0f172a" stroke="#3b82f6"/>
  <!-- part on conveyor -->
  <rect x="80" y="290" width="280" height="16" rx="4" fill="#1e293b" stroke="#334155"/>
  <rect x="300" y="272" width="32" height="18" rx="3" fill="#334155" stroke="#10b981"/>
  <!-- controller panel -->
  <rect x="440" y="100" width="170" height="200" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="456" y="128" fill="#60a5fa" font-size="11" font-family="ui-monospace,monospace">CONTROLLER</text>
  <rect x="456" y="144" width="138" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="468" y="166" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">JOB: PICK-01</text>
  <rect x="456" y="192" width="138" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="468" y="214" fill="#34d399" font-size="11" font-family="ui-monospace,monospace">STATUS: RUN</text>
  <rect x="456" y="240" width="138" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="468" y="262" fill="#93c5fd" font-size="11" font-family="ui-monospace,monospace">PLC LINK: OK</text>
</svg>
