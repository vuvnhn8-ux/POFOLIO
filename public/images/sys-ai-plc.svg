<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-labelledby="t">
  <title id="t">AI + PLC control loop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#1e293b" stroke-width="2"/>
  <text x="28" y="40" fill="#60a5fa" font-family="ui-monospace,monospace" font-size="13">AI + PLC CONTROL LOOP</text>
  <text x="28" y="58" fill="#64748b" font-family="ui-monospace,monospace" font-size="10">Sensors → AI Model → PLC Logic → Actuators · closed loop</text>
  <!-- Sensor block -->
  <rect x="40" y="100" width="140" height="100" rx="12" fill="#020617" stroke="#38bdf8"/>
  <text x="56" y="130" fill="#7dd3fc" font-size="12" font-family="ui-monospace,monospace">SENSORS</text>
  <text x="56" y="152" fill="#94a3b8" font-size="10" font-family="ui-monospace,monospace">Temp · Flow</text>
  <text x="56" y="170" fill="#94a3b8" font-size="10" font-family="ui-monospace,monospace">Pressure · I/O</text>
  <text x="56" y="188" fill="#94a3b8" font-size="10" font-family="ui-monospace,monospace">Status bits</text>
  <!-- AI block -->
  <rect x="250" y="90" width="140" height="120" rx="12" fill="#020617" stroke="#10b981" stroke-width="1.5"/>
  <text x="266" y="120" fill="#34d399" font-size="12" font-family="ui-monospace,monospace">AI ENGINE</text>
  <rect x="266" y="136" width="108" height="10" rx="2" fill="#064e3b"/>
  <rect x="266" y="136" width="78" height="10" rx="2" fill="#10b981" opacity="0.75"/>
  <text x="266" y="168" fill="#94a3b8" font-size="10" font-family="ui-monospace,monospace">anomaly score</text>
  <text x="266" y="186" fill="#a7f3d0" font-size="10" font-family="ui-monospace,monospace">predict · optimize</text>
  <!-- PLC block -->
  <rect x="460" y="100" width="140" height="100" rx="12" fill="#020617" stroke="#3b82f6"/>
  <text x="476" y="130" fill="#60a5fa" font-size="12" font-family="ui-monospace,monospace">PLC</text>
  <text x="476" y="152" fill="#94a3b8" font-size="10" font-family="ui-monospace,monospace">Ladder / ST</text>
  <text x="476" y="170" fill="#94a3b8" font-size="10" font-family="ui-monospace,monospace">Interlock</text>
  <text x="476" y="188" fill="#93c5fd" font-size="10" font-family="ui-monospace,monospace">DO / AO out</text>
  <!-- arrows -->
  <path d="M180 150 H250" stroke="#38bdf8" stroke-width="2"/>
  <path d="M390 150 H460" stroke="#10b981" stroke-width="2"/>
  <!-- bottom feedback -->
  <rect x="40" y="240" width="560" height="80" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="56" y="270" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">FEEDBACK · SCADA tags · historian · setpoint tuning</text>
  <polyline points="56,300 120,292 180,298 240,285 300,290 360,278 420,286 480,272 540,280 590,275"
    stroke="url(#g1)" stroke-width="2.5" fill="none"/>
</svg>
