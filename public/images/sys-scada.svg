<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-labelledby="t">
  <title id="t">SCADA / HMI overview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#1e293b" stroke-width="2"/>
  <!-- top bar -->
  <rect x="24" y="20" width="592" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="44" cy="38" r="5" fill="#ef4444"/><circle cx="62" cy="38" r="5" fill="#eab308"/><circle cx="80" cy="38" r="5" fill="#22c55e"/>
  <text x="110" y="43" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">SCADA · PLANT OVERVIEW · LINE-A</text>
  <text x="520" y="43" fill="#34d399" font-family="ui-monospace,monospace" font-size="11" filter="url(#glow)">● LIVE</text>
  <!-- main panels -->
  <rect x="24" y="72" width="280" height="180" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="40" y="96" fill="#60a5fa" font-family="ui-monospace,monospace" font-size="11">PROCESS FLOW</text>
  <!-- tanks -->
  <rect x="50" y="120" width="48" height="70" rx="6" fill="#0f172a" stroke="#3b82f6"/>
  <rect x="54" y="150" width="40" height="36" rx="3" fill="#3b82f6" opacity="0.45"/>
  <text x="56" y="210" fill="#64748b" font-size="9" font-family="ui-monospace,monospace">TANK-01</text>
  <path d="M98 155 H130" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="145" cy="155" r="28" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <circle cx="145" cy="155" r="14" fill="#10b981" opacity="0.35"/>
  <text x="133" y="159" fill="#a7f3d0" font-size="10" font-family="ui-monospace,monospace">MIX</text>
  <path d="M173 155 H205" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="205" y="120" width="70" height="70" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <path d="M220 155 h40 M240 135 v40" stroke="#60a5fa" stroke-width="2"/>
  <text x="218" y="210" fill="#64748b" font-size="9" font-family="ui-monospace,monospace">REACTOR</text>
  <!-- right metrics -->
  <rect x="320" y="72" width="296" height="180" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="336" y="96" fill="#34d399" font-family="ui-monospace,monospace" font-size="11">KPI · REALTIME</text>
  <rect x="336" y="112" width="120" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="348" y="132" fill="#64748b" font-size="10" font-family="ui-monospace,monospace">OEE</text>
  <text x="348" y="154" fill="#f1f5f9" font-size="20" font-family="ui-sans-serif,system-ui" font-weight="700">94.2%</text>
  <rect x="468" y="112" width="128" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="480" y="132" fill="#64748b" font-size="10" font-family="ui-monospace,monospace">CYCLE</text>
  <text x="480" y="154" fill="#60a5fa" font-size="20" font-family="ui-sans-serif,system-ui" font-weight="700">1.8s</text>
  <rect x="336" y="180" width="120" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="348" y="200" fill="#64748b" font-size="10" font-family="ui-monospace,monospace">ALARM</text>
  <text x="348" y="222" fill="#34d399" font-size="20" font-family="ui-sans-serif,system-ui" font-weight="700">0</text>
  <rect x="468" y="180" width="128" height="56" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="480" y="200" fill="#64748b" font-size="10" font-family="ui-monospace,monospace">YIELD</text>
  <text x="480" y="222" fill="#a7f3d0" font-size="20" font-family="ui-sans-serif,system-ui" font-weight="700">99.7%</text>
  <!-- bottom trend -->
  <rect x="24" y="268" width="592" height="68" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="40" y="290" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10">TREND · TEMP / PRESSURE / FLOW</text>
  <polyline points="40,320 80,310 120,315 160,300 200,305 240,292 280,298 320,288 360,295 400,280 440,285 480,275 520,282 560,270 600,278"
    stroke="url(#g1)" stroke-width="2.5" fill="none" filter="url(#glow)"/>
</svg>
