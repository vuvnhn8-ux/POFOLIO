<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-labelledby="t">
  <title id="t">Full plant automation layers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#1e293b" stroke-width="2"/>
  <text x="28" y="40" fill="#e2e8f0" font-family="ui-sans-serif,system-ui" font-size="16" font-weight="700">FULL FACTORY AUTOMATION STACK</text>
  <text x="28" y="60" fill="#64748b" font-family="ui-monospace,monospace" font-size="10">Cell → Line → Plant · integrated architecture</text>
  <!-- layers -->
  <g font-family="ui-monospace,monospace">
    <rect x="40" y="88" width="560" height="48" rx="10" fill="#0f172a" stroke="#3b82f6"/>
    <text x="56" y="110" fill="#60a5fa" font-size="11">L4  ENTERPRISE</text>
    <text x="56" y="126" fill="#94a3b8" font-size="10">MES · ERP · Production orders · Traceability</text>

    <rect x="40" y="148" width="560" height="48" rx="10" fill="#0f172a" stroke="#6366f1"/>
    <text x="56" y="170" fill="#a5b4fc" font-size="11">L3  SCADA / SUPERVISION</text>
    <text x="56" y="186" fill="#94a3b8" font-size="10">HMI · Alarm · Historian · OEE dashboards</text>

    <rect x="40" y="208" width="560" height="48" rx="10" fill="#0f172a" stroke="#10b981"/>
    <text x="56" y="230" fill="#34d399" font-size="11">L2  CONTROL</text>
    <text x="56" y="246" fill="#94a3b8" font-size="10">PLC · Robot controller · Safety PLC · Motion</text>

    <rect x="40" y="268" width="560" height="48" rx="10" fill="#0f172a" stroke="#38bdf8"/>
    <text x="56" y="290" fill="#7dd3fc" font-size="11">L1  FIELD</text>
    <text x="56" y="306" fill="#94a3b8" font-size="10">Sensors · Cameras · Servo · I/O · Actuators · AGV</text>
  </g>
  <rect x="40" y="332" width="560" height="6" rx="3" fill="url(#bar)" opacity="0.8"/>
</svg>
