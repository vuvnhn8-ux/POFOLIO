<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-labelledby="t">
  <title id="t">Smart factory stack — live data flow simulation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f24"/><stop offset="1" stop-color="#101738"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6366f1"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gr" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#6366f1" stroke-opacity="0.07" fill="none"/>
    </pattern>
  </defs>

  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect width="640" height="360" rx="18" fill="url(#gr)"/>
  <rect x="0.5" y="0.5" width="639" height="359" rx="17.5" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- ambient dust -->
  <circle cx="100" cy="120" r="1.5" fill="#22d3ee" opacity="0.3">
    <animateMotion dur="15s" repeatCount="indefinite" path="M100 120 C 160 160, 120 220, 180 260"/>
  </circle>
  <circle cx="600" cy="280" r="1.4" fill="#a78bfa" opacity="0.3">
    <animateMotion dur="19s" repeatCount="indefinite" path="M600 280 C 560 240, 610 200, 570 150"/>
  </circle>

  <text x="28" y="36" fill="#8b93c9" font-family="ui-monospace,monospace" font-size="11">SMART FACTORY STACK · ISA-95</text>
  <circle cx="516" cy="33" r="3.5" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="524" y="37" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="10">DIGITAL TWIN</text>

  <!-- scanning sweep -->
  <rect x="60" y="56" width="440" height="5" rx="2.5" fill="#22d3ee" opacity="0.14">
    <animate attributeName="y" values="56;296;56" dur="16s" repeatCount="indefinite"/>
  </rect>

  <!-- stack layers with passing highlight wave (bottom -> top) -->
  <g font-family="ui-monospace,monospace">
    <rect x="60" y="56" width="440" height="42" rx="12" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.5s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.06;0.12;0.06" dur="3.5s" begin="2.1s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="74" fill="#c4b5fd" font-size="10">L5 · CLOUD</text>
    <text x="80" y="89" fill="#8b93c9" font-size="8.5">Fleet analytics · Remote ops</text>

    <rect x="60" y="106" width="440" height="42" rx="12" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.5s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.06;0.12;0.06" dur="3.5s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="124" fill="#a5b4fc" font-size="10">L4 · AI / MES</text>
    <text x="80" y="139" fill="#8b93c9" font-size="8.5">Orders · Traceability · Optimization models</text>

    <rect x="60" y="156" width="440" height="42" rx="12" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.5s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.06;0.12;0.06" dur="3.5s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="174" fill="#7dd3fc" font-size="10">L3 · SCADA</text>
    <text x="80" y="189" fill="#8b93c9" font-size="8.5">HMI · Alarms · Historian · OEE</text>

    <rect x="60" y="206" width="440" height="42" rx="12" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.08;0.16;0.08" dur="3.5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="224" fill="#a5b4fc" font-size="10">L2 · PLC CONTROL</text>
    <text x="80" y="239" fill="#8b93c9" font-size="8.5">Ladder/ST · Interlock · Motion</text>

    <rect x="60" y="256" width="440" height="42" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.22;0.5;0.22" dur="3.5s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="274" fill="#e2e8f0" font-size="10">L1 · FIELD DEVICES</text>
    <text x="80" y="289" fill="#8b93c9" font-size="8.5">Sensors · Servo · I/O · AGV · Robot</text>
  </g>

  <!-- data bus: up packets + down packets -->
  <line x1="528" y1="70" x2="528" y2="292" stroke="url(#holo)" stroke-width="1.6" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;48" dur="4.5s" repeatCount="indefinite"/>
  </line>
  <circle cx="528" cy="283" r="4" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cy" values="283;73" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="528" cy="283" r="3" fill="#a5f3fc" filter="url(#glow)">
    <animate attributeName="cy" values="283;73" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="528" cy="283" r="2.5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cy" values="283;73" dur="4.5s" begin="-3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="528" cy="70" r="3" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="cy" values="70;283" dur="6s" begin="-2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="528" cy="70" r="2.5" fill="#c4b5fd" filter="url(#glow)">
    <animate attributeName="cy" values="70;283" dur="6s" begin="-5s" repeatCount="indefinite"/>
  </circle>

  <!-- side connectors: animated dash + jitter when data passes -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1">
    <path d="M500 77 h28"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path>
    <path d="M500 127 h28"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" begin="-0.8s" repeatCount="indefinite"/></path>
    <path d="M500 177 h28"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" begin="-1.4s" repeatCount="indefinite"/></path>
    <path d="M500 227 h28"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" begin="-0.4s" repeatCount="indefinite"/></path>
    <path d="M500 277 h28"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" begin="-1.1s" repeatCount="indefinite"/></path>
  </g>

  <!-- bottom status -->
  <g font-family="ui-monospace,monospace" font-size="9">
    <rect x="60" y="316" width="150" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="76" cy="327" r="3.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="330" fill="#aab0d8">FIELD: 1,240 TAGS</text>
    <rect x="222" y="316" width="150" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="238" cy="327" r="3.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="250" y="330" fill="#aab0d8">SCADA: ONLINE</text>
    <rect x="384" y="316" width="116" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="400" cy="327" r="3.5" fill="#a78bfa">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="412" y="330" fill="#aab0d8">AI: ACTIVE</text>
  </g>
</svg>