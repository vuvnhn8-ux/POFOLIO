<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-labelledby="t">
  <title id="t">AI + PLC closed-loop — live control simulation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f24"/><stop offset="1" stop-color="#101738"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366f1"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gr" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#6366f1" stroke-opacity="0.07" fill="none"/>
    </pattern>
  </defs>

  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect width="640" height="360" rx="18" fill="url(#gr)"/>
  <rect x="0.5" y="0.5" width="639" height="359" rx="17.5" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- ambient dust -->
  <circle cx="120" cy="300" r="1.6" fill="#22d3ee" opacity="0.3">
    <animateMotion dur="16s" repeatCount="indefinite" path="M120 300 C 180 250, 260 320, 340 280"/>
  </circle>
  <circle cx="520" cy="260" r="1.4" fill="#a78bfa" opacity="0.3">
    <animateMotion dur="20s" repeatCount="indefinite" path="M520 260 C 460 220, 540 180, 480 140"/>
  </circle>

  <text x="28" y="36" fill="#8b93c9" font-family="ui-monospace,monospace" font-size="11">AI + PLC · CLOSED-LOOP CONTROL</text>
  <circle cx="536" cy="33" r="3.5" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="544" y="37" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="10">SYNC</text>

  <!-- loop ring with direction marker -->
  <circle cx="320" cy="196" r="118" stroke="url(#holo)" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 8">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="78" r="5" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/>
  <polygon points="312,73 312,83 321,78" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="3s" repeatCount="indefinite"/>
  </polygon>

  <!-- travelling data packets -->
  <circle r="5" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M320 78 A118 118 0 1 1 319.9 78"/>
  </circle>
  <circle r="3.5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="8s" begin="-2.7s" repeatCount="indefinite" path="M320 78 A118 118 0 1 1 319.9 78"/>
  </circle>
  <circle r="2.5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="8s" begin="-5.3s" repeatCount="indefinite" path="M320 78 A118 118 0 1 1 319.9 78"/>
  </circle>
  <circle r="1.8" fill="#a5f3fc" opacity="0.7">
    <animateMotion dur="8s" begin="-1.3s" repeatCount="indefinite" path="M320 78 A118 118 0 1 1 319.9 78"/>
  </circle>

  <!-- center state -->
  <circle cx="320" cy="196" r="46" fill="#ffffff" fill-opacity="0.05" stroke="url(#holo)" stroke-opacity="0.7">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="196" r="46" fill="none" stroke="#22d3ee" stroke-opacity="0.3">
    <animate attributeName="r" values="46;54" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="189" text-anchor="middle" fill="#aab0d8" font-family="ui-monospace,monospace" font-size="8">STATE</text>
  <text x="320" y="201" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="9">
    CONTROL LOOP ACTIVE
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.55;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="320" y="201" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="9" filter="url(#glow)">
    OPTIMIZING
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="320" y="216" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="9">
    <tspan>12 </tspan><tspan fill="#8b93c9">ms</tspan>
  </text>

  <!-- nodes -->
  <g font-family="ui-monospace,monospace">
    <rect x="252" y="56" width="136" height="44" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="74" text-anchor="middle" fill="#a5b4fc" font-size="10">SENSORS</text>
    <text x="320" y="90" text-anchor="middle" fill="#8b93c9" font-size="8">Temp · Flow · I/O</text>
    <rect x="412" y="174" width="148" height="48" rx="12" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.8"/>
    <circle cx="486" cy="198" r="18" fill="none" stroke="#22d3ee" stroke-opacity="0.5">
      <animate attributeName="r" values="14;32" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="486" y="194" text-anchor="middle" fill="#7dd3fc" font-size="10">AI MODEL</text>
    <text x="486" y="210" text-anchor="middle" fill="#8b93c9" font-size="8">
      <tspan>infer 8ms · </tspan><tspan fill="#a5b4fc">anomaly 0.02</tspan>
    </text>
    <rect x="252" y="288" width="136" height="44" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="306" text-anchor="middle" fill="#c4b5fd" font-size="10">PLC</text>
    <text x="320" y="322" text-anchor="middle" fill="#8b93c9" font-size="8">Ladder · Interlock</text>
    <rect x="80" y="174" width="148" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#6366f1" stroke-opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="154" y="194" text-anchor="middle" fill="#a5b4fc" font-size="10">ACTUATORS</text>
    <text x="154" y="210" text-anchor="middle" fill="#8b93c9" font-size="8">Servo · Valve · Gripper</text>
  </g>

  <!-- connectors: dash flow + data packets -->
  <g stroke="url(#holo)" stroke-width="1.4" stroke-dasharray="5 5">
    <path d="M388 92 C 420 120, 440 140, 458 174">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M486 222 C 470 258, 430 284, 388 296">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M252 296 C 200 282, 168 250, 156 222">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M154 174 C 170 136, 210 108, 252 92">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle r="3.2" fill="#a5f3fc" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M388 92 C 420 120, 440 140, 458 174"/>
  </circle>
  <circle r="3.2" fill="#c4b5fd" filter="url(#glow)">
    <animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M486 222 C 470 258, 430 284, 388 296"/>
  </circle>
  <circle r="3.2" fill="#a5b4fc" filter="url(#glow)">
    <animateMotion dur="4s" begin="-1s" repeatCount="indefinite" path="M252 296 C 200 282, 168 250, 156 222"/>
  </circle>
  <circle r="3.2" fill="#7dd3fc" filter="url(#glow)">
    <animateMotion dur="4s" begin="-3s" repeatCount="indefinite" path="M154 174 C 170 136, 210 108, 252 92"/>
  </circle>

  <!-- bottom tags -->
  <g font-family="ui-monospace,monospace" font-size="9">
    <rect x="200" y="338" width="116" height="18" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="214" cy="347" r="2.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="222" y="350" fill="#aab0d8">setpoint: AUTO</text>
    <rect x="328" y="338" width="116" height="18" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="342" cy="347" r="2.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="350" y="350" fill="#7dd3fc">loop: STABLE</text>
  </g>
</svg>